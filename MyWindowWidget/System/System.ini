; =============================================================
;  MyWindowWidget - System (CPU / GPU / RAM / drives)
;  CPU and GPU: usage % + line graph of the last CpuGraphSeconds.
;  RAM: %, rounded bar, used / total GB.
;  Drives (SystemDrives in Variables.inc, up to 4): used %, bar,
;  free space.
;  Numbers (and bars) turn ColorWarn at >= WarnThreshold (drives:
;  DiskWarnThreshold).
;  Logic: @Resources\Scripts\System.lua (GPU usage via GpuLoad.ps1,
;  drive rows, card height)
;
;  The drive measures and meters below were generated by a script;
;  the four slots only differ in their numbers.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget System
Author=leafbell-sii
Information=CPU, GPU and RAM usage and free drive space. Drives: SystemDrives in @Resources\Variables.inc.
Version=0.2.0
License=MIT

[Variables]
CardW=#CompactWidth#

; Text box heights follow Segoe UI: ~1.78 x pt.
ValueH=(1.78*#FontSizeL#)
DriveValueH=(1.78*#FontSizeM#)
TitleH=(1.78*#FontSizeS#)
; Move a small label down so its baseline meets the value's
; (large values: CPU / GPU / RAM, medium values: drives).
LabelDY=(#FontAscentNum#*#FontSizeL#-#FontAscent#*#FontSizeS#)
DriveLabelDY=(#FontAscentNum#*#FontSizeM#-#FontAscent#*#FontSizeS#)

; Columns: label (CPU / RAM / C:), big % value (room for "100%"
; plus a small gap), then the graph / bar up to the right edge.
LabelColW=(32*#Scale#)
ValueColW=(62*#Scale#)
ValueX=(#Pad#+#LabelColW#)
VisX=(#ValueX#+#ValueColW#)
VisW=(#CardW#-#Pad#-#VisX#)

; Rows, top to bottom: title, CPU graph, GPU graph, separator,
; RAM, separator, drives.
GraphH=(30*#Scale#)
CpuY=(#Pad#+#TitleH#+#Gap#/2)
GpuY=(#CpuY#+#GraphH#+#Gap#)
CpuValueY=(#CpuY#+(#GraphH#-#ValueH#)/2)
GpuValueY=(#GpuY#+(#GraphH#-#ValueH#)/2)
Sep1Y=(#GpuY#+#GraphH#+#Gap#/2)
RamY=(#Sep1Y#+#Gap#/2)
Sep2Y=(#RamY#+#ValueH#+#Gap#/2)
DriveY=(#Sep2Y#+#Gap#/2)
DriveRowH=(#DriveValueH#+#Gap#/4)
Drive1Y=#DriveY#
Drive2Y=(#DriveY#+#DriveRowH#)
Drive3Y=(#DriveY#+2*#DriveRowH#)
Drive4Y=(#DriveY#+3*#DriveRowH#)
; Card height with N drive rows is CardHBase + N x DriveRowH;
; System.lua sets CardH.
CardHBase=(#DriveY#-#Gap#/4+#Pad#)
CardH=(#CardHBase#+#DriveRowH#)

; The graph meters draw one sample per pixel, so they are
; CpuGraphSeconds px wide and stretched to VisW with a
; TransformationMatrix.
CpuGraphSeconds=60
GraphSX=(#VisW#/#CpuGraphSeconds#)

; Fixed room for "15.7 / 31.9 GB" / "170.5 GB free" so the bars
; do not change length with the text.
RamDetailW=(78*#Scale#*#FontScale#)
RamBarW=(#VisW#-#RamDetailW#-#Gap#)

; Set by IfConditions below.
CpuTextColor=#ColorTextPrimary#
GpuTextColor=#ColorTextPrimary#
RamTextColor=#ColorTextPrimary#
RamBarColor=#ColorAccent#
Drive1Color=#ColorAccent#
Drive2Color=#ColorAccent#
Drive3Color=#ColorAccent#
Drive4Color=#ColorAccent#
Drive1TextColor=#ColorTextPrimary#
Drive2TextColor=#ColorTextPrimary#
Drive3TextColor=#ColorTextPrimary#
Drive4TextColor=#ColorTextPrimary#

; ---- Measures -----------------------------------------------

[MeasureCPU]
Measure=CPU
Processor=0
IfCondition=MeasureCPU >= #WarnThreshold#
IfTrueAction=[!SetVariable CpuTextColor "#ColorWarn#"]
IfFalseAction=[!SetVariable CpuTextColor "#ColorTextPrimary#"]

; Not the UsageMonitor plugin: it crashed Rainmeter 4.5.28 on
; Windows 11 build 26300 (2026-11-17). System.lua returns the
; GPU usage (GpuLoad.ps1 samples it, Task Manager's definition).
[MeasureGPU]
Measure=Script
ScriptFile=#@#Scripts\System.lua
MinValue=0
MaxValue=100
IfCondition=MeasureGPU >= #WarnThreshold#
IfTrueAction=[!SetVariable GpuTextColor "#ColorWarn#"]
IfFalseAction=[!SetVariable GpuTextColor "#ColorTextPrimary#"]

; Runs GpuLoad.ps1 (Parameter set by System.lua). It keeps running;
; it stops by itself when the skin stops writing Cache\gpu.alive.
[MeasureGpuRun]
Measure=Plugin
Plugin=RunCommand
State=Hide

; Used physical memory, in bytes.
[MeasureRam]
Measure=PhysicalMemory

[MeasureRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=60

[MeasureRamUsedGB]
Measure=Calc
Formula=MeasureRam/1073741824

[MeasureRamTotalGB]
Measure=Calc
Formula=MeasureRamTotal/1073741824

[MeasureRamPct]
Measure=Calc
Formula=(MeasureRamTotal > 0) ? (MeasureRam/MeasureRamTotal*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureRamPct >= #WarnThreshold#
IfTrueAction=[!SetVariable RamTextColor "#ColorWarn#"][!SetVariable RamBarColor "#ColorWarn#"]
IfFalseAction=[!SetVariable RamTextColor "#ColorTextPrimary#"][!SetVariable RamBarColor "#ColorAccent#"]

; Drive slots. System.lua (MeasureGPU) sets Drive= from SystemDrives and
; disables the measures of unused slots.

[MeasureDriveFree1]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDriveTotal1]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=300

[MeasureDrivePct1]
Measure=Calc
; Max(...,1): Calc reports "Division by 0" even in the unused
; branch of ?: when a drive is missing (total 0).
Formula=(MeasureDriveTotal1 > 0) ? (100-MeasureDriveFree1/Max(MeasureDriveTotal1,1)*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDrivePct1 >= #DiskWarnThreshold#
IfTrueAction=[!SetVariable Drive1TextColor "#ColorWarn#"][!SetVariable Drive1Color "#ColorWarn#"]
IfFalseAction=[!SetVariable Drive1TextColor "#ColorTextPrimary#"][!SetVariable Drive1Color "#ColorAccent#"]

[MeasureDriveFree2]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDriveTotal2]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=300

[MeasureDrivePct2]
Measure=Calc
; Max(...,1): Calc reports "Division by 0" even in the unused
; branch of ?: when a drive is missing (total 0).
Formula=(MeasureDriveTotal2 > 0) ? (100-MeasureDriveFree2/Max(MeasureDriveTotal2,1)*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDrivePct2 >= #DiskWarnThreshold#
IfTrueAction=[!SetVariable Drive2TextColor "#ColorWarn#"][!SetVariable Drive2Color "#ColorWarn#"]
IfFalseAction=[!SetVariable Drive2TextColor "#ColorTextPrimary#"][!SetVariable Drive2Color "#ColorAccent#"]

[MeasureDriveFree3]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDriveTotal3]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=300

[MeasureDrivePct3]
Measure=Calc
; Max(...,1): Calc reports "Division by 0" even in the unused
; branch of ?: when a drive is missing (total 0).
Formula=(MeasureDriveTotal3 > 0) ? (100-MeasureDriveFree3/Max(MeasureDriveTotal3,1)*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDrivePct3 >= #DiskWarnThreshold#
IfTrueAction=[!SetVariable Drive3TextColor "#ColorWarn#"][!SetVariable Drive3Color "#ColorWarn#"]
IfFalseAction=[!SetVariable Drive3TextColor "#ColorTextPrimary#"][!SetVariable Drive3Color "#ColorAccent#"]

[MeasureDriveFree4]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=30

[MeasureDriveTotal4]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=300

[MeasureDrivePct4]
Measure=Calc
; Max(...,1): Calc reports "Division by 0" even in the unused
; branch of ?: when a drive is missing (total 0).
Formula=(MeasureDriveTotal4 > 0) ? (100-MeasureDriveFree4/Max(MeasureDriveTotal4,1)*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureDrivePct4 >= #DiskWarnThreshold#
IfTrueAction=[!SetVariable Drive4TextColor "#ColorWarn#"][!SetVariable Drive4Color "#ColorWarn#"]
IfFalseAction=[!SetVariable Drive4TextColor "#ColorTextPrimary#"][!SetVariable Drive4Color "#ColorAccent#"]

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard
@IncludeCardArt=#@#CardArt.inc

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Text=System

; ---- CPU ----

; Soft area fill under the line.
[MeterCpuHistogram]
Meter=Histogram
MeterStyle=StyleHistogram
MeasureName=MeasureCPU
X=#VisX#
Y=#CpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0

[MeterCpuLine]
Meter=Line
MeterStyle=StyleLineGraph
MeasureName=MeasureCPU
X=#VisX#
Y=#CpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0
TransformStroke=Fixed

; Baseline under the graph.
[MeterCpuBaseline]
Meter=Shape
X=#VisX#
Y=(#CpuY#+#GraphH#-1)
Shape=Rectangle 0,0,#VisW#,1 | Fill Color #ColorBorder# | StrokeWidth 0

[MeterCpuValue]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureCPU
Text=%1%
NumOfDecimals=0
FontColor=#CpuTextColor#
X=#ValueX#
Y=#CpuValueY#
DynamicVariables=1

[MeterCpuLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=CPU
X=#Pad#
Y=(#CpuValueY#+#LabelDY#)

; ---- GPU ----

[MeterGpuHistogram]
Meter=Histogram
MeterStyle=StyleHistogram
MeasureName=MeasureGPU
X=#VisX#
Y=#GpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0

[MeterGpuLine]
Meter=Line
MeterStyle=StyleLineGraph
MeasureName=MeasureGPU
X=#VisX#
Y=#GpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0
TransformStroke=Fixed

[MeterGpuBaseline]
Meter=Shape
X=#VisX#
Y=(#GpuY#+#GraphH#-1)
Shape=Rectangle 0,0,#VisW#,1 | Fill Color #ColorBorder# | StrokeWidth 0

[MeterGpuValue]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureGPU
Text=%1%
NumOfDecimals=0
FontColor=#GpuTextColor#
X=#ValueX#
Y=#GpuValueY#
DynamicVariables=1

[MeterGpuLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=GPU
X=#Pad#
Y=(#GpuValueY#+#LabelDY#)

[MeterSep1]
Meter=Shape
MeterStyle=StyleSeparator
Y=#Sep1Y#

; ---- RAM ----

[MeterRamValue]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureRamPct
Text=%1%
NumOfDecimals=0
FontColor=#RamTextColor#
X=#ValueX#
Y=#RamY#
DynamicVariables=1

[MeterRamLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=RAM
X=#Pad#
Y=(#RamY#+#LabelDY#)

[MeterRamDetail]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureRamUsedGB
MeasureName2=MeasureRamTotalGB
Text=%1 / %2 GB
NumOfDecimals=1
Y=(#RamY#+#LabelDY#)

; Track + fill, vertically centred on the % value.
[MeterRamBar]
Meter=Shape
X=#VisX#
Y=(#RamY#+#ValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureRamPct:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #RamBarColor# | StrokeWidth 0
DynamicVariables=1

[MeterSep2]
Meter=Shape
MeterStyle=StyleSeparator
Y=#Sep2Y#

; ---- Drives ----
; One row per slot (group DriveN): label "C:", used %, bar, free
; space. System.lua sets the label text and packs the rows of the
; drives that exist (Y); unused slots and missing drives are hidden
; and moved to Y=0 (a hidden meter still stretches the window).

[MeterDriveLabel1]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=
X=#Pad#
Y=(#Drive1Y#+#DriveLabelDY#)
Group=Drive1

[MeterDriveValue1]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureDrivePct1
Text=%1%
NumOfDecimals=0
FontSize=#FontSizeM#
FontColor=#Drive1TextColor#
X=#ValueX#
Y=#Drive1Y#
DynamicVariables=1
Group=Drive1

[MeterDriveBar1]
Meter=Shape
X=#VisX#
Y=(#Drive1Y#+#DriveValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureDrivePct1:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #Drive1Color# | StrokeWidth 0
DynamicVariables=1
Group=Drive1

; AutoScale=1: 1024-based k / M / G / T, so "%1B" reads "170.5 GB".
[MeterDriveDetail1]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureDriveFree1
Text=%1B free
AutoScale=1
NumOfDecimals=1
Y=(#Drive1Y#+#DriveLabelDY#)
Group=Drive1

[MeterDriveLabel2]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=
X=#Pad#
Y=(#Drive2Y#+#DriveLabelDY#)
Group=Drive2

[MeterDriveValue2]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureDrivePct2
Text=%1%
NumOfDecimals=0
FontSize=#FontSizeM#
FontColor=#Drive2TextColor#
X=#ValueX#
Y=#Drive2Y#
DynamicVariables=1
Group=Drive2

[MeterDriveBar2]
Meter=Shape
X=#VisX#
Y=(#Drive2Y#+#DriveValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureDrivePct2:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #Drive2Color# | StrokeWidth 0
DynamicVariables=1
Group=Drive2

; AutoScale=1: 1024-based k / M / G / T, so "%1B" reads "170.5 GB".
[MeterDriveDetail2]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureDriveFree2
Text=%1B free
AutoScale=1
NumOfDecimals=1
Y=(#Drive2Y#+#DriveLabelDY#)
Group=Drive2

[MeterDriveLabel3]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=
X=#Pad#
Y=(#Drive3Y#+#DriveLabelDY#)
Group=Drive3

[MeterDriveValue3]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureDrivePct3
Text=%1%
NumOfDecimals=0
FontSize=#FontSizeM#
FontColor=#Drive3TextColor#
X=#ValueX#
Y=#Drive3Y#
DynamicVariables=1
Group=Drive3

[MeterDriveBar3]
Meter=Shape
X=#VisX#
Y=(#Drive3Y#+#DriveValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureDrivePct3:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #Drive3Color# | StrokeWidth 0
DynamicVariables=1
Group=Drive3

; AutoScale=1: 1024-based k / M / G / T, so "%1B" reads "170.5 GB".
[MeterDriveDetail3]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureDriveFree3
Text=%1B free
AutoScale=1
NumOfDecimals=1
Y=(#Drive3Y#+#DriveLabelDY#)
Group=Drive3

[MeterDriveLabel4]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=
X=#Pad#
Y=(#Drive4Y#+#DriveLabelDY#)
Group=Drive4

[MeterDriveValue4]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureDrivePct4
Text=%1%
NumOfDecimals=0
FontSize=#FontSizeM#
FontColor=#Drive4TextColor#
X=#ValueX#
Y=#Drive4Y#
DynamicVariables=1
Group=Drive4

[MeterDriveBar4]
Meter=Shape
X=#VisX#
Y=(#Drive4Y#+#DriveValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureDrivePct4:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #Drive4Color# | StrokeWidth 0
DynamicVariables=1
Group=Drive4

; AutoScale=1: 1024-based k / M / G / T, so "%1B" reads "170.5 GB".
[MeterDriveDetail4]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureDriveFree4
Text=%1B free
AutoScale=1
NumOfDecimals=1
Y=(#Drive4Y#+#DriveLabelDY#)
Group=Drive4
