; =============================================================
;  MyWindowWidget - System (CPU / RAM)
;  Short card (CompactWidth x CompactHeight), one row each:
;  CPU: total usage % + line graph of the last CpuGraphSeconds.
;  RAM: %, rounded bar, used / total GB.
;  Numbers (and the RAM bar) turn ColorWarn at >= WarnThreshold.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget System
Author=leafbell-sii
Information=CPU and RAM usage.
Version=0.1.0
License=MIT

[Variables]
CardW=#CompactWidth#
CardH=#CompactHeight#

; Text box heights follow Segoe UI: ~1.78 x pt.
ValueH=(1.78*#FontSizeL#)
TitleH=(1.78*#FontSizeS#)
; Moves a small label down so its baseline meets the value's.
LabelDY=(1.44*(#FontSizeL#-#FontSizeS#))

; Columns: label (CPU / RAM), big % value (room for "100%"
; plus a small gap), then the graph / bar
; up to the right edge.
LabelColW=(32*#Scale#)
ValueColW=(62*#Scale#)
ValueX=(#Pad#+#LabelColW#)
VisX=(#ValueX#+#ValueColW#)
VisW=(#CardW#-#Pad#-#VisX#)

; Rows: RAM sits on the bottom padding, the CPU graph fills the
; space between the title and the separator.
RamY=(#CardH#-#Pad#-#ValueH#)
SepY=(#RamY#-#Gap#/2)
CpuY=(#Pad#+#TitleH#+#Gap#/2)
GraphH=(#SepY#-#Gap#-#CpuY#)
CpuValueY=(#CpuY#+(#GraphH#-#ValueH#)/2)

; The graph meter draws one sample per pixel, so it is
; CpuGraphSeconds px wide and stretched to VisW with a
; TransformationMatrix.
CpuGraphSeconds=60
GraphSX=(#VisW#/#CpuGraphSeconds#)

; Fixed room for "15.7 / 31.9 GB" so the bar does not change
; length with the text.
RamDetailW=(78*#Scale#)
RamBarW=(#VisW#-#RamDetailW#-#Gap#)

; Set by IfConditions below.
CpuTextColor=#ColorTextPrimary#
RamTextColor=#ColorTextPrimary#
RamBarColor=#ColorAccent#

; ---- Measures -----------------------------------------------

[MeasureCPU]
Measure=CPU
Processor=0
IfCondition=MeasureCPU >= #WarnThreshold#
IfTrueAction=[!SetVariable CpuTextColor "#ColorWarn#"]
IfFalseAction=[!SetVariable CpuTextColor "#ColorTextPrimary#"]

; Used physical memory, in bytes.
[MeasureRam]
Measure=PhysicalMemory

[MeasureRamTotal]
Measure=PhysicalMemory
Total=1
UpdateDivider=60

[MeasureRamUsedGB]
Measure=Calc
Formula=MeasureRam/1073741824

[MeasureRamTotalGB]
Measure=Calc
Formula=MeasureRamTotal/1073741824

[MeasureRamPct]
Measure=Calc
Formula=(MeasureRamTotal > 0) ? (MeasureRam/MeasureRamTotal*100) : 0
MinValue=0
MaxValue=100
IfCondition=MeasureRamPct >= #WarnThreshold#
IfTrueAction=[!SetVariable RamTextColor "#ColorWarn#"][!SetVariable RamBarColor "#ColorWarn#"]
IfFalseAction=[!SetVariable RamTextColor "#ColorTextPrimary#"][!SetVariable RamBarColor "#ColorAccent#"]

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Text=System

; ---- CPU ----

; Soft area fill under the line.
[MeterCpuHistogram]
Meter=Histogram
MeterStyle=StyleHistogram
MeasureName=MeasureCPU
X=#VisX#
Y=#CpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0

[MeterCpuLine]
Meter=Line
MeterStyle=StyleLineGraph
MeasureName=MeasureCPU
X=#VisX#
Y=#CpuY#
W=#CpuGraphSeconds#
H=#GraphH#
TransformationMatrix=#GraphSX#;0;0;1;(#VisX#*(1-#GraphSX#));0
TransformStroke=Fixed

; Baseline under the graph.
[MeterCpuBaseline]
Meter=Shape
X=#VisX#
Y=(#CpuY#+#GraphH#-1)
Shape=Rectangle 0,0,#VisW#,1 | Fill Color #ColorBorder# | StrokeWidth 0

[MeterCpuValue]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureCPU
Text=%1%
NumOfDecimals=0
FontColor=#CpuTextColor#
X=#ValueX#
Y=#CpuValueY#
DynamicVariables=1

[MeterCpuLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=CPU
X=#Pad#
Y=(#CpuValueY#+#LabelDY#)

[MeterSep]
Meter=Shape
MeterStyle=StyleSeparator
Y=#SepY#

; ---- RAM ----

[MeterRamValue]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureRamPct
Text=%1%
NumOfDecimals=0
FontColor=#RamTextColor#
X=#ValueX#
Y=#RamY#
DynamicVariables=1

[MeterRamLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=RAM
X=#Pad#
Y=(#RamY#+#LabelDY#)

[MeterRamDetail]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
MeasureName=MeasureRamUsedGB
MeasureName2=MeasureRamTotalGB
Text=%1 / %2 GB
NumOfDecimals=1
Y=(#RamY#+#LabelDY#)

; Track + fill, vertically centred on the % value.
[MeterRamBar]
Meter=Shape
X=#VisX#
Y=(#RamY#+#ValueH#/2-#BarH#/2)
Shape=Rectangle 0,0,#RamBarW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape2=Rectangle 0,0,(Max(#BarH#,#RamBarW#*Clamp([MeasureRamPct:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #RamBarColor# | StrokeWidth 0
DynamicVariables=1
