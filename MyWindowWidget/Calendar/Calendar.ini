; =============================================================
;  MyWindowWidget - Calendar (Google Calendar via private iCal address)
;
;  Month grid with today / selected day and per-calendar event
;  dots, plus an Upcoming list (next 5 events, or the events of
;  a clicked day). Everything is filled in by
;  @Resources\Scripts\Calendar.lua; .ics parsing is in
;  ICalParser.lua.
;
;  Feeds: ICalUrl1..4 in @Resources\Secrets.inc (git-ignored).
;  Empty URLs are not fetched at all (no log errors); the list
;  then shows a hint. Feeds refresh every ICalRefreshSeconds;
;  the last good copy is cached in @Resources\Cache\calN.ics and
;  shown while offline ("offline" next to UPCOMING).
;  Checked 2026-11-17: on a failed fetch WebParser logs only
;  "[MeasureICalN] (Fetch error) <reason>", not the URL. The skin
;  never logs URLs itself.
;  TODO(verify): with a real Google address - its "%40" (the @
;  in the e-mail) must reach Google unchanged.
;
;  Mouse: month title = back to today, < > = previous / next
;  month, day = list that day's events (click again = Upcoming).
;
;  The 42 day cells and list rows below were generated once by a
;  script; they only differ in their numbers.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeSecrets=#@#Secrets.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Calendar
Author=leafbell-sii
Information=Month view and upcoming events from Google Calendar (iCal). Put your iCal URL in @Resources\Secrets.inc.
Version=0.1.0
License=MIT

[Variables]
CardW=#CalendarWidth#
Ic=#IconSize#

; Grid geometry. Text box heights follow Segoe UI: ~1.78 x pt.
CellW=((#CardW#-2*#Pad#)/7)
CellH=(30*#Scale#)
HeaderH=(1.78*#FontSizeL#)
WdY=(#Pad#+#HeaderH#+#Gap#/2)
GridY=(#WdY#+1.78*#FontSizeS#+2*#Scale#)
SepY=(#GridY#+6*#CellH#+#Gap#/2)

; Upcoming list.
UpHeadY=(#SepY#+#Gap#)
UpY=(#UpHeadY#+1.78*#FontSizeS#+4*#Scale#)
UpRows=5
UpRowH=(19*#Scale#)
DotR=(1.7*#Scale#)
DotCol=(10*#Scale#)
WhenW=(92*#Scale#)
UpTextW=(#CardW#-2*#Pad#-#DotCol#-#WhenW#)

CardH=(#UpY#+#UpRows#*#UpRowH#+#Pad#-2*#Scale#)

; ---- Measures -----------------------------------------------

; One WebParser per feed (whole .ics captured as the string
; value; the RegExp also rejects non-calendar responses).
; Disabled until Calendar.lua sees a non-empty ICalUrlN.
; UpdateRate x Update(1000 ms) = refresh interval.
[MeasureICal1]
Measure=WebParser
URL=#ICalUrl1#
RegExp=(?s)^(BEGIN:VCALENDAR.*)$
StringIndex=1
UpdateRate=#ICalRefreshSeconds#
LogSubstringErrors=0
FinishAction=[!CommandMeasure MeasureCalendar "OnDownloaded(1)"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendar "OnError(1)"]
OnRegExpErrorAction=[!CommandMeasure MeasureCalendar "OnInvalid(1)"]
Disabled=1

[MeasureICal2]
Measure=WebParser
URL=#ICalUrl2#
RegExp=(?s)^(BEGIN:VCALENDAR.*)$
StringIndex=1
UpdateRate=#ICalRefreshSeconds#
LogSubstringErrors=0
FinishAction=[!CommandMeasure MeasureCalendar "OnDownloaded(2)"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendar "OnError(2)"]
OnRegExpErrorAction=[!CommandMeasure MeasureCalendar "OnInvalid(2)"]
Disabled=1

[MeasureICal3]
Measure=WebParser
URL=#ICalUrl3#
RegExp=(?s)^(BEGIN:VCALENDAR.*)$
StringIndex=1
UpdateRate=#ICalRefreshSeconds#
LogSubstringErrors=0
FinishAction=[!CommandMeasure MeasureCalendar "OnDownloaded(3)"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendar "OnError(3)"]
OnRegExpErrorAction=[!CommandMeasure MeasureCalendar "OnInvalid(3)"]
Disabled=1

[MeasureICal4]
Measure=WebParser
URL=#ICalUrl4#
RegExp=(?s)^(BEGIN:VCALENDAR.*)$
StringIndex=1
UpdateRate=#ICalRefreshSeconds#
LogSubstringErrors=0
FinishAction=[!CommandMeasure MeasureCalendar "OnDownloaded(4)"]
OnConnectErrorAction=[!CommandMeasure MeasureCalendar "OnError(4)"]
OnRegExpErrorAction=[!CommandMeasure MeasureCalendar "OnInvalid(4)"]
Disabled=1

; Must come after the feed measures.
[MeasureCalendar]
Measure=Script
ScriptFile=#@#Scripts\Calendar.lua

; ---- Styles -------------------------------------------------

[StyleDay]
StringAlign=CenterCenter
FontSize=#FontSizeM#
W=#CellW#
H=#CellH#
SolidColor=0,0,0,1
Group=Cal

[StyleWeekday]
StringAlign=Center
Y=#WdY#
Group=Cal

[StyleUpWhen]
StringAlign=LeftCenter
X=(#Pad#+#DotCol#)
Group=Cal

[StyleUpText]
StringAlign=LeftCenter
X=(#Pad#+#DotCol#+#WhenW#)
W=#UpTextW#
ClipString=1
Group=Cal

[StyleChevron]
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
ChevronStroke=Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | Stroke Color #ColorTextSecondary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round

