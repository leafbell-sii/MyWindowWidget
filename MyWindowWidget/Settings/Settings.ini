; =============================================================
;  MyWindowWidget - Settings
;  Theme, card opacity, clock format and calendar week start for
;  the whole suite. A click writes to @Resources\Variables.inc and
;  refreshes every MyWindowWidget skin (!RefreshGroup MyWindowWidget).
;  Logic: @Resources\Scripts\Settings.lua
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Settings
Author=leafbell-sii
Information=Pick theme, opacity, 24h clock, seconds and week start for all MyWindowWidget skins.
Version=0.1.0
License=MIT

[Variables]
CardW=#WidgetWidth#
; Text box height of the small font (Segoe UI ~1.78 x pt).
LineH=(1.78*#FontSizeS#)

; Theme swatches: 2 rows of 4 slots, each a circle of SwD plus
; room for the selection ring (3 px each side) and a name below.
ThemeLabelY=(#Pad#+#LineH#+#Gap#)
SwY=(#ThemeLabelY#+#LineH#+4*#Scale#)
SwD=(30*#Scale#)
SwBox=(#SwD#+6)
SlotW=((#CardW#-2*#Pad#)/4)
SwY2=(#SwY#+#SwBox#+2+#LineH#+#Gap#/2)
SepY=(#SwY2#+#SwBox#+2+#LineH#+#Gap#)

; Option rows.
RowH=(30*#Scale#)
Row1Y=(#SepY#+#Gap#/2)
Row2Y=(#Row1Y#+#RowH#)
Row3Y=(#Row2Y#+#RowH#)
Row4Y=(#Row3Y#+#RowH#)
PillW=(46*#Scale#)
PillH=(22*#Scale#)
PillGap=(4*#Scale#)
PillOff=((#RowH#-#PillH#)/2)
TrackW=(34*#Scale#)
TrackH=(18*#Scale#)
TrackOff=((#RowH#-#TrackH#)/2)
; Right edge of the controls column.
CtrlR=(#CardW#-#Pad#)

CardH=(#Row4Y#+#RowH#+#Pad#-4*#Scale#)

; ---- Measures -----------------------------------------------

[MeasureSettings]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

; ---- Styles -------------------------------------------------

; Lua-drawn controls start as an invisible 1 px shape.
[StyleCtrl]
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Group=Set

[StyleRowLabel]
X=#Pad#
StringAlign=LeftCenter

[StylePillText]
StringAlign=CenterCenter
FontSize=#FontSizeS#
Group=Set

[StyleSwName]
StringAlign=Center
Y=(#SwY#+#SwBox#+2)
Group=Set

[StyleSwRow2]
Y=#SwY2#

[StyleSwNameRow2]
Y=(#SwY2#+#SwBox#+2)

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard
@IncludeCardArt=#@#CardArt.inc

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Text=Settings

; ---- Theme ----

[MeterThemeLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=Theme
X=#Pad#
Y=#ThemeLabelY#

[MeterSw1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+0.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(1)"]

[MeterSw2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+1.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(2)"]

[MeterSw3]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+2.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(3)"]

[MeterSw4]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+3.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(4)"]

[MeterSwName1]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName
X=(#Pad#+0.5*#SlotW#)

[MeterSwName2]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName
X=(#Pad#+1.5*#SlotW#)

[MeterSwName3]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName
X=(#Pad#+2.5*#SlotW#)

[MeterSwName4]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName
X=(#Pad#+3.5*#SlotW#)

[MeterSw5]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+0.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(5)"]

[MeterSw6]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+1.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(6)"]

[MeterSw7]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+2.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(7)"]

[MeterSw8]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+3.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(8)"]

[MeterSwName5]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2
X=(#Pad#+0.5*#SlotW#)

[MeterSwName6]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2
X=(#Pad#+1.5*#SlotW#)

[MeterSwName7]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2
X=(#Pad#+2.5*#SlotW#)

[MeterSwName8]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2
X=(#Pad#+3.5*#SlotW#)

[MeterSep]
Meter=Shape
MeterStyle=StyleSeparator
Y=#SepY#

; ---- Opacity: 70 / 85 / 100 % ----

[MeterOpLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel
Text=Opacity
Y=(#Row1Y#+#RowH#/2)

[MeterOp1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-3*#PillW#-2*#PillGap#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(178)"]

[MeterOp2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-2*#PillW#-#PillGap#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(217)"]

[MeterOp3]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#PillW#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(255)"]

[MeterOpText1]
Meter=String
MeterStyle=StyleText | StylePillText
Text=70%
X=(#CtrlR#-2.5*#PillW#-2*#PillGap#)
Y=(#Row1Y#+#RowH#/2)

[MeterOpText2]
Meter=String
MeterStyle=StyleText | StylePillText
Text=85%
X=(#CtrlR#-1.5*#PillW#-#PillGap#)
Y=(#Row1Y#+#RowH#/2)

[MeterOpText3]
Meter=String
MeterStyle=StyleText | StylePillText
Text=100%
X=(#CtrlR#-0.5*#PillW#)
Y=(#Row1Y#+#RowH#/2)

; ---- Clock ----

[MeterT24Label]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel
Text=24-hour clock
Y=(#Row2Y#+#RowH#/2)

[MeterT24]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#TrackW#)
Y=(#Row2Y#+#TrackOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Toggle('Use24h')"]

[MeterTSecLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel
Text=Show seconds
Y=(#Row3Y#+#RowH#/2)

[MeterTSec]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#TrackW#)
Y=(#Row3Y#+#TrackOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Toggle('ShowSeconds')"]

; ---- Calendar week start ----

[MeterWsLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel
Text=Week starts on
Y=(#Row4Y#+#RowH#/2)

[MeterWs1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-2*#PillW#-#PillGap#)
Y=(#Row4Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetWeekStart('Mon')"]

[MeterWs2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#PillW#)
Y=(#Row4Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetWeekStart('Sun')"]

[MeterWsText1]
Meter=String
MeterStyle=StyleText | StylePillText
Text=Mon
X=(#CtrlR#-1.5*#PillW#-#PillGap#)
Y=(#Row4Y#+#RowH#/2)

[MeterWsText2]
Meter=String
MeterStyle=StyleText | StylePillText
Text=Sun
X=(#CtrlR#-0.5*#PillW#)
Y=(#Row4Y#+#RowH#/2)
