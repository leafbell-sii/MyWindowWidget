; =============================================================
;  MyWindowWidget - Clock (time, weather, settings)
;
;  Clock view: big HH:mm, small seconds (optional), AM/PM in 12h
;  mode; on the right the weather for the place Windows reports
;  (icon, temperature, condition and place name) and the settings
;  button at the top right.
;
;  Settings view: the same card switches to the suite settings
;  (theme, opacity, clock format, week start, temperature unit);
;  the X at the top right switches back. A change is written to
;  @Resources\Variables.inc and refreshes every MyWindowWidget skin;
;  this card then comes back in the settings view.
;
;  Logic: @Resources\Scripts\Settings.lua (views, settings) and
;  Weather.lua + Weather.ps1 (location, weather download).
;  Settings (Variables.inc): Use24h, ShowSeconds, TempUnit,
;  WeatherRefreshSeconds, WeatherLatitude / Longitude / Place,
;  WeatherLanguage
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Clock
Author=leafbell-sii
Information=Time and local weather. The button at the top right opens the suite settings (theme, opacity, clock, week start, temperature unit).
Version=0.2.0
License=MIT

[Variables]
CardW=#ClockWidth#
Ic=#IconSize#
; Text box height of the small font.
LineH=(#FontLineH#*#FontSizeS#)

; ---- Clock view ----
; The large glyphs carry extra space above the digits; the Y
; offset pulls the digit tops up to ~0.2 x size below Pad (Font*
; metrics are in Variables.inc / the theme).
TimeY=(#Pad#-(#FontCapTopNum#-0.205)*#FontSizeXL#)
TimeBase=(#TimeY#+#FontAscentNum#*#FontSizeXL#)
; Settings button: a pill centred on the title row of the other
; cards.
BtnW=(40*#Scale#*#FontScale#)
BtnH=(20*#Scale#)
BtnCY=(#Pad#+#LineH#/2)
; Weather, right-aligned under the button: icon + temperature,
; then "condition - place" in the small font.
WxIconS=(24*#Scale#)
WxTop=(#BtnCY#+#BtnH#/2+#Gap#)
WxTempY=(#WxTop#-#FontCapTopNum#*#FontSizeL#)
WxTempBase=(#WxTempY#+#FontAscentNum#*#FontSizeL#)
WxSubY=(#WxTempBase#+0.75*#Gap#-#FontCapTop#*#FontSizeS#)
WxSubBase=(#WxSubY#+#FontAscent#*#FontSizeS#)
WxSubW=(#CardW#*0.46)
; = Max(TimeBase, WxSubBase) + 0.205*FontSizeXL + Pad, written out
; in Variables.inc so the collapsed Music card can match it. Change
; ClockHeight there when this layout changes.
CardHClock=#ClockHeight#

; ---- Settings view ----
; Theme swatches: 2 rows of 4 slots, each a circle of SwD plus
; room for the selection ring (3 px each side) and a name below.
ThemeLabelY=(#Pad#+#LineH#+#Gap#)
SwY=(#ThemeLabelY#+#LineH#+4*#Scale#)
SwD=(30*#Scale#)
SwBox=(#SwD#+6)
SlotW=((#CardW#-2*#Pad#)/4)
SwY2=(#SwY#+#SwBox#+2+#LineH#+#Gap#/2)
SepY=(#SwY2#+#SwBox#+2+#LineH#+#Gap#)
; Option rows.
RowH=(30*#Scale#)
Row1Y=(#SepY#+#Gap#/2)
Row2Y=(#Row1Y#+#RowH#)
Row3Y=(#Row2Y#+#RowH#)
Row4Y=(#Row3Y#+#RowH#)
Row5Y=(#Row4Y#+#RowH#)
PillW=(46*#Scale#)
PillH=(22*#Scale#)
PillGap=(4*#Scale#)
PillOff=((#RowH#-#PillH#)/2)
TrackW=(34*#Scale#)
TrackH=(18*#Scale#)
TrackOff=((#RowH#-#TrackH#)/2)
; Right edge of the controls column.
CtrlR=(#CardW#-#Pad#)
CardHSet=(#Row5Y#+#RowH#+#Pad#-4*#Scale#)

; Settings.lua sets CardH to CardHClock or CardHSet.
CardH=#CardHClock#

; ---- Measures -----------------------------------------------

; Applies Use24h once at load. Settings.lua shows / hides the
; AM/PM and seconds meters (Use24h, ShowSeconds).
[MeasureMode]
Measure=Calc
Formula=#Use24h#
UpdateDivider=-1
IfCondition=MeasureMode = 1
IfTrueAction=[!SetOption MeasureTime Format "%H:%M"]
IfFalseAction=[!SetOption MeasureTime Format "%#I:%M"]

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSeconds]
Measure=Time
Format=%S

; FormatLocale (not TimeStampLocale) controls the language of
; day / month names in Format output.
[MeasureAmPm]
Measure=Time
Format=%p
FormatLocale=en-US

[MeasureSettings]
Measure=Script
ScriptFile=#@#Scripts\Settings.lua

; Parameter is set by Weather.lua before every Run. Hide kills the
; script if the skin is refreshed or unloaded mid-run. Timeout
; (ms) stops a hung run; FinishAction still fires.
[MeasureWeatherRun]
Measure=Plugin
Plugin=RunCommand
State=Hide
Timeout=60000
FinishAction=[!CommandMeasure MeasureWeather "OnDone()"]

[MeasureWeather]
Measure=Script
ScriptFile=#@#Scripts\Weather.lua

; ---- Styles -------------------------------------------------

; Settings view: everything is in group SetView and inside the
; container MeterSetView, which the clock view hides. Lua-drawn
; controls start as an invisible 1 px shape.
[StyleSet]
Group=SetView
Container=MeterSetView

[StyleCtrl]
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
Group=Set | SetView
Container=MeterSetView

[StyleRowLabel]
X=#Pad#
StringAlign=LeftCenter

[StylePillText]
StringAlign=CenterCenter
FontSize=#FontSizeS#

[StyleSwName]
StringAlign=Center
Y=(#SwY#+#SwBox#+2)

[StyleSwRow2]
Y=#SwY2#

[StyleSwNameRow2]
Y=(#SwY2#+#SwBox#+2)

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard
@IncludeCardArt=#@#CardArt.inc

; ============ Clock view (group ClockView) ============

[MeterTime]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureTime
FontSize=#FontSizeXL#
X=(#Pad#-2*#Scale#)
Y=#TimeY#
Group=ClockView

; Seconds share the time's baseline: the baseline sits
; FontAscentNum px per pt below the top of the text box.
[MeterSeconds]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureSeconds
FontSize=#FontSizeL#
FontColor=#ColorAccent#
X=([MeterTime:XW]+#Gap#/2)
Y=([MeterTime:Y]+#FontAscentNum#*(#FontSizeXL#-#FontSizeL#))
DynamicVariables=1
Group=ClockView

; AM / PM aligned with the top of the digits.
[MeterAmPm]
Meter=String
MeterStyle=StyleText | StyleLabel
MeasureName=MeasureAmPm
FontWeight=#FontWeightTitle#
X=([MeterTime:XW]+#Gap#/2)
Y=([MeterTime:Y]+#FontCapTopNum#*#FontSizeXL#-#FontCapTop#*#FontSizeS#)
DynamicVariables=1
Hidden=1
Group=ClockView

; Settings button. The label is Korean on purpose ([\xC124][\xC815]
; is the word for "settings"); the theme fonts without Hangul fall
; back to a Windows font. BtnFill changes on hover.
[MeterSetBtn]
Meter=Shape
X=(#CardW#-#Pad#-#BtnW#)
Y=(#BtnCY#-#BtnH#/2)
Shape=Rectangle 0.5,0.5,(#BtnW#-1),(#BtnH#-1),((#BtnH#-1)/2) | StrokeWidth 1 | Stroke Color #ColorBorder# | Extend BtnFill
BtnFill=Fill Color #ColorBgAlt#
MouseOverAction=[!SetOption MeterSetBtn BtnFill "Fill Color #ColorAccentSoft#"][!UpdateMeter MeterSetBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterSetBtn BtnFill "Fill Color #ColorBgAlt#"][!UpdateMeter MeterSetBtn][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureSettings "OpenSettings()"]
ToolTipText=Settings
Group=ClockView

[MeterSetBtnText]
Meter=String
MeterStyle=StyleText | StyleLabel
StringAlign=CenterCenter
FontColor=#ColorTextPrimary#
Text=[\xC124][\xC815]
X=(#CardW#-#Pad#-#BtnW#/2)
Y=#BtnCY#
DynamicVariables=1
Group=ClockView

; Temperature, right-aligned. Weather.lua sets Text, ToolTipText.
; A click re-reads the weather.
[MeterWxTemp]
Meter=String
MeterStyle=StyleText | StyleValue
StringAlign=Right
X=(#CardW#-#Pad#)
Y=#WxTempY#
Text=
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureWeather "Refresh()"]
Group=ClockView | Weather

; Weather icon left of the temperature. Weather.lua draws it
; (Shape..ShapeN) in a WxIconS box.
[MeterWxIcon]
Meter=Shape
X=([MeterWxTemp:X]-#Gap#/2-#WxIconS#)
Y=(#WxTop#+(#FontAscentNum#-#FontCapTopNum#)*#FontSizeL#/2-#WxIconS#/2)
Shape=Rectangle 0,0,#WxIconS#,#WxIconS# | Fill Color 0,0,0,1 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureWeather "Refresh()"]
Group=ClockView | Weather

; "Light rain - place". Weather.lua sets Text, FontColor,
; ToolTipText.
[MeterWxSub]
Meter=String
MeterStyle=StyleText | StyleLabel
StringAlign=Right
X=(#CardW#-#Pad#)
Y=#WxSubY#
W=#WxSubW#
ClipString=1
Text=
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure MeasureWeather "Refresh()"]
Group=ClockView | Weather

; ============ Settings view (group SetView) ============

; Mask of the settings view. Checked 2026-11-17: a hidden meter
; still stretches the window (DynamicWindowSize) down to its Y,
; container contents do not. So the clock view is only short
; because everything below is in here and this is hidden.
[MeterSetView]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardHSet# | Fill Color 255,255,255,255 | StrokeWidth 0
Hidden=1

[MeterSetTitle]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleSet
Text=Settings

; Back to the clock view: an X in an Ic box.
[MeterClose]
Meter=Shape
MeterStyle=StyleSet
X=(#CardW#-#Pad#-#Ic#)
Y=(#BtnCY#-#Ic#/2)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Line (#Ic#*0.22),(#Ic#*0.22),(#Ic#*0.78),(#Ic#*0.78) | Extend CloseStroke
Shape3=Line (#Ic#*0.78),(#Ic#*0.22),(#Ic#*0.22),(#Ic#*0.78) | Extend CloseStroke
CloseStroke=StrokeWidth #IconStrokeW# | Stroke Color #ColorTextSecondary# | StrokeStartCap Round | StrokeEndCap Round
ToolTipText=Close
LeftMouseUpAction=[!CommandMeasure MeasureSettings "CloseSettings()"]

; ---- Theme ----

[MeterThemeLabel]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSet
Text=Theme
X=#Pad#
Y=#ThemeLabelY#

[MeterSw1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+0.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(1)"]

[MeterSw2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+1.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(2)"]

[MeterSw3]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+2.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(3)"]

[MeterSw4]
Meter=Shape
MeterStyle=StyleCtrl
X=(#Pad#+3.5*#SlotW#-#SwBox#/2)
Y=#SwY#
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(4)"]

[MeterSwName1]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSet
X=(#Pad#+0.5*#SlotW#)

[MeterSwName2]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSet
X=(#Pad#+1.5*#SlotW#)

[MeterSwName3]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSet
X=(#Pad#+2.5*#SlotW#)

[MeterSwName4]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSet
X=(#Pad#+3.5*#SlotW#)

[MeterSw5]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+0.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(5)"]

[MeterSw6]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+1.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(6)"]

[MeterSw7]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+2.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(7)"]

[MeterSw8]
Meter=Shape
MeterStyle=StyleCtrl | StyleSwRow2
X=(#Pad#+3.5*#SlotW#-#SwBox#/2)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTheme(8)"]

[MeterSwName5]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2 | StyleSet
X=(#Pad#+0.5*#SlotW#)

[MeterSwName6]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2 | StyleSet
X=(#Pad#+1.5*#SlotW#)

[MeterSwName7]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2 | StyleSet
X=(#Pad#+2.5*#SlotW#)

[MeterSwName8]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleSwName | StyleSwNameRow2 | StyleSet
X=(#Pad#+3.5*#SlotW#)

[MeterSep]
Meter=Shape
MeterStyle=StyleSeparator | StyleSet
Y=#SepY#

; ---- Opacity: 70 / 85 / 100 % ----

[MeterOpLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel | StyleSet
Text=Opacity
Y=(#Row1Y#+#RowH#/2)

[MeterOp1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-3*#PillW#-2*#PillGap#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(178)"]

[MeterOp2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-2*#PillW#-#PillGap#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(217)"]

[MeterOp3]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#PillW#)
Y=(#Row1Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetAlpha(255)"]

[MeterOpText1]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=70%
X=(#CtrlR#-2.5*#PillW#-2*#PillGap#)
Y=(#Row1Y#+#RowH#/2)

[MeterOpText2]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=85%
X=(#CtrlR#-1.5*#PillW#-#PillGap#)
Y=(#Row1Y#+#RowH#/2)

[MeterOpText3]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=100%
X=(#CtrlR#-0.5*#PillW#)
Y=(#Row1Y#+#RowH#/2)

; ---- Clock ----

[MeterT24Label]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel | StyleSet
Text=24-hour clock
Y=(#Row2Y#+#RowH#/2)

[MeterT24]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#TrackW#)
Y=(#Row2Y#+#TrackOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Toggle('Use24h')"]

[MeterTSecLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel | StyleSet
Text=Show seconds
Y=(#Row3Y#+#RowH#/2)

[MeterTSec]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#TrackW#)
Y=(#Row3Y#+#TrackOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "Toggle('ShowSeconds')"]

; ---- Calendar week start ----

[MeterWsLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel | StyleSet
Text=Week starts on
Y=(#Row4Y#+#RowH#/2)

[MeterWs1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-2*#PillW#-#PillGap#)
Y=(#Row4Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetWeekStart('Mon')"]

[MeterWs2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#PillW#)
Y=(#Row4Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetWeekStart('Sun')"]

[MeterWsText1]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=Mon
X=(#CtrlR#-1.5*#PillW#-#PillGap#)
Y=(#Row4Y#+#RowH#/2)

[MeterWsText2]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=Sun
X=(#CtrlR#-0.5*#PillW#)
Y=(#Row4Y#+#RowH#/2)

; ---- Weather temperature unit ----

[MeterTuLabel]
Meter=String
MeterStyle=StyleText | StyleBody | StyleRowLabel | StyleSet
Text=Temperature
Y=(#Row5Y#+#RowH#/2)

[MeterTu1]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-2*#PillW#-#PillGap#)
Y=(#Row5Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTempUnit('C')"]

[MeterTu2]
Meter=Shape
MeterStyle=StyleCtrl
X=(#CtrlR#-#PillW#)
Y=(#Row5Y#+#PillOff#)
LeftMouseUpAction=[!CommandMeasure MeasureSettings "SetTempUnit('F')"]

; [\xB0] is the degree sign.
[MeterTuText1]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=[\xB0]C
X=(#CtrlR#-1.5*#PillW#-#PillGap#)
Y=(#Row5Y#+#RowH#/2)
DynamicVariables=1

[MeterTuText2]
Meter=String
MeterStyle=StyleText | StylePillText | StyleSet
Text=[\xB0]F
X=(#CtrlR#-0.5*#PillW#)
Y=(#Row5Y#+#RowH#/2)
DynamicVariables=1
