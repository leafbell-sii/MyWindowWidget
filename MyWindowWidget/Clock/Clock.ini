; =============================================================
;  MyWindowWidget - Clock
;  Big HH:mm, small seconds (optional), AM/PM in 12h mode,
;  English date line regardless of the Windows display language.
;  Settings (Variables.inc): Use24h, ShowSeconds
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Clock
Author=leafbell-sii
Information=Time and English date. Edit Use24h / ShowSeconds in @Resources\Variables.inc.
Version=0.1.0
License=MIT

[Variables]
CardW=#WidgetWidth#
CardH=([MeterDate:YH]+#Pad#)

; ---- Measures -----------------------------------------------

; Applies Use24h / ShowSeconds once at load.
[MeasureMode]
Measure=Calc
Formula=#Use24h#
UpdateDivider=-1
IfCondition=MeasureMode = 1
IfTrueAction=[!SetOption MeasureTime Format "%H:%M"][!HideMeter MeterAmPm]
IfFalseAction=[!SetOption MeasureTime Format "%#I:%M"][!ShowMeter MeterAmPm]
IfCondition2=#ShowSeconds# = 0
IfTrueAction2=[!HideMeter MeterSeconds]

; FormatLocale (not TimeStampLocale) controls the language of
; day / month names in Format output.
[MeasureTime]
Measure=Time
Format=%H:%M
FormatLocale=en-US

[MeasureSeconds]
Measure=Time
Format=%S

[MeasureAmPm]
Measure=Time
Format=%p
FormatLocale=en-US

[MeasureDate]
Measure=Time
Format=%A, %B %#d
FormatLocale=en-US

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard

; The large glyphs carry extra space above the digits;
; the Y offset pulls them up so padding looks even.
[MeterTime]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureTime
FontSize=#FontSizeXL#
X=(#Pad#-2*#Scale#)
Y=(#Pad#-0.30*#FontSizeXL#)

; Date sits under the time; the negative offset trims the
; empty descent area of the large font.
[MeterDate]
Meter=String
MeterStyle=StyleText | StyleBody
MeasureName=MeasureDate
FontColor=#ColorTextSecondary#
X=#Pad#
Y=(-0.22*#FontSizeXL#)R

; Seconds share the time's baseline. Segoe UI's ascent is
; ~1.08 em and 1pt = 1.333px, so baseline offset between two
; top-aligned sizes is ~1.44 * (sizeA - sizeB).
[MeterSeconds]
Meter=String
MeterStyle=StyleText | StyleValue
MeasureName=MeasureSeconds
FontSize=#FontSizeL#
FontColor=#ColorAccent#
X=([MeterTime:XW]+#Gap#/2)
Y=([MeterTime:Y]+1.44*(#FontSizeXL#-#FontSizeL#))
DynamicVariables=1

; AM / PM aligned with the top of the digits.
[MeterAmPm]
Meter=String
MeterStyle=StyleText | StyleLabel
MeasureName=MeasureAmPm
FontWeight=600
X=([MeterTime:XW]+#Gap#/2)
Y=([MeterTime:Y]+0.51*(#FontSizeXL#-#FontSizeS#))
DynamicVariables=1
Hidden=1
