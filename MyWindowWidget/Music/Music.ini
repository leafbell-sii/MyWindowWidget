; =============================================================
;  MyWindowWidget - Music player (Spotify desktop via WebNowPlaying)
;
;  Plugin: WebNowPlaying Redux (github.com/keifufu/WebNowPlaying-Rainmeter)
;  Checked 2026-11-17 against src/main.c on main (v3.0.0) and
;  wnp.keifufu.dev/rainmeter/usage. Uses the PlayerType names
;  that exist in both v2.0.7 and v3 (v3 keeps them as legacy
;  aliases): Status, Title, Artist, Album, Cover, State,
;  Position, Duration, Progress, Repeat, Shuffle.
;  v3 reads desktop players (Windows media session) itself; no
;  browser extension or Spicetify needed.
;  TODO(verify): when packaging, confirm which v3 build ships in
;  @Vault (installed DLL reports FileVersion 3.0.0).
;
;  Two views, switched by the chevron at the top right
;  (@Resources\Scripts\Music.lua):
;    collapsed  as tall as the Clock card (ClockHeight): cover,
;               title, artist, previous / play / next, seek bar
;    expanded   large cover, title / artist / album, times, full
;               seek bar, shuffle / previous / play / next / repeat.
;               The card is Topmost while expanded (ZOrder.lua), as
;               it covers the cards below it.
;  The view is kept in @Resources\Cache\music.view.
;
;  Every position is computed from variables, never from the
;  height of a text meter, and each view sits in a Container (whose
;  contents do not stretch the window). So a title in a fallback
;  font (kana, Hangul) or the seek row appearing when a track starts
;  can no longer change the card size.
;
;  Album art: click to bring up Spotify. Mouse wheel on the card:
;  volume (not supported by most desktop players).
;  Seek: click anywhere on the progress bar. Rainmeter has no
;  mouse-move action, so drag-to-seek is not possible.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
MouseScrollUpAction=[!CommandMeasure MeasureState "SetVolume +5"]
MouseScrollDownAction=[!CommandMeasure MeasureState "SetVolume -5"]
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Music
Author=leafbell-sii
Information=Now playing card for Spotify (WebNowPlaying plugin). The chevron at the top right expands / collapses it.
Version=0.2.0
License=MIT

[Variables]
CardW=#MusicWidth#
Ic=#IconSize#
; Previous / next in the expanded view.
IcL=(18*#Scale#)
CtrlGap=(14*#Scale#)
CtrlGapL=(22*#Scale#)
SeekHitH=(12*#Scale#)
KnobR=(4.5*#Scale#)
LineS=(#FontLineH#*#FontSizeS#)

; ---- Collapsed view ----
CardHMini=#ClockHeight#
; The cover fills the card height inside Pad.
ArtS=(#CardHMini#-2*#Pad#)
TextX=(2*#Pad#+#ArtS#)
TextW=(#CardW#-#TextX#-#Pad#)
; Title cap tops line up with the cover top; the artist follows
; the title's baseline.
TitleY=(#Pad#-#FontCapTop#*#FontSizeM#)
TitleBase=(#Pad#+(#FontAscent#-#FontCapTop#)*#FontSizeM#)
SubY=(#TitleBase#+0.75*#Gap#-#FontCapTop#*#FontSizeS#)
; Expand button, centred on the title's capitals.
ChevY=(#Pad#+(#FontAscent#-#FontCapTop#)*#FontSizeM#/2-#Ic#/2)
; Controls sit on the cover's bottom edge; the seek bar takes the
; rest of the row.
CtrlTop=(#Pad#+#ArtS#-#PlayButtonSize#)
CtrlCY=(#CtrlTop#+#PlayButtonSize#/2)
SeekX=(#TextX#+2*#Ic#+3*#CtrlGap#+#PlayButtonSize#)
SeekW=(#CardW#-#Pad#-#SeekX#)

; ---- Expanded view ----
; Header row (NOW PLAYING + collapse button), then the cover with
; title / artist / album / times beside it.
FChevY=(#Pad#+(#FontCapTop#+#FontAscent#)*#FontSizeS#/2-#Ic#/2)
FArtY=(#Pad#+#LineS#+#Gap#)
FTextX=(2*#Pad#+#ArtSizeL#)
FTextW=(#CardW#-#FTextX#-#Pad#)
FTitleY=(#FArtY#-#FontCapTop#*#FontSizeL#)
FTitleBase=(#FArtY#+(#FontAscent#-#FontCapTop#)*#FontSizeL#)
FArtistY=(#FTitleBase#+1.5*#Gap#-#FontCapTop#*#FontSizeM#)
FArtistBase=(#FTitleBase#+1.5*#Gap#+(#FontAscent#-#FontCapTop#)*#FontSizeM#)
FAlbumY=(#FArtistBase#+0.75*#Gap#-#FontCapTop#*#FontSizeS#)
; Times: baseline on the cover's bottom edge.
FTimesY=(#FArtY#+#ArtSizeL#-#FontAscent#*#FontSizeM#)
; Full-width seek bar under the cover, then the controls row.
FSeekY=(#FArtY#+#ArtSizeL#+#Gap#)
FSeekW=(#CardW#-2*#Pad#)
FCtrlTop=(#FSeekY#+#SeekHitH#+#Gap#)
FCtrlCY=(#FCtrlTop#+#PlayButtonSizeL#/2)
FPlayX=((#CardW#-#PlayButtonSizeL#)/2)
CardHFull=(#FCtrlTop#+#PlayButtonSizeL#+#Pad#)

; Music.lua sets CardH to CardHMini or CardHFull.
CardH=#CardHMini#

; Set by IfConditions.
CtrlColor=#ColorTextPrimary#
PlayFill=#ColorAccent#
ShuffleColor=#ColorTextSecondary#
RepeatColor=#ColorTextSecondary#

; ---- Measures -----------------------------------------------

[MeasureStatus]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Status

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist

[MeasureAlbum]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Album

; "  <middle dot>  Album" when there is an album, else empty.
[MeasureAlbumSuffix]
Measure=String
String=[MeasureAlbum]
DynamicVariables=1
RegExpSubstitute=1
Substitute="^(.+)$":"  [\x00B7]  \1"

; Path of the downloaded cover image. With no cover (and no
; DefaultPath) v3 returns no string, so Rainmeter falls back to
; the number "0"; MeasureCoverPath turns that into "".
[MeasureCover]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Cover

; Empty when there is no cover; Music.lua then hides the image
; meters and the Shape placeholder shows.
[MeasureCoverPath]
Measure=String
String=[MeasureCover]
DynamicVariables=1
RegExpSubstitute=1
; Never use a pattern that can match an empty string here
; (e.g. "^0?$"): Rainmeter's substitute loop does not advance
; on zero-length matches and hangs.
Substitute="^0$":""

; Number value = seconds.
[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position
Group=MusicPos

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration

; 0 - 100
[MeasureProgress]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Progress
MinValue=0
MaxValue=100
Group=MusicPos

; 0 = stopped, 1 = playing, 2 = paused.
; Idle (no player or stopped): "Nothing playing", controls muted
; and their click actions disabled. Which meters are shown (cover,
; play / pause icon, seek row) depends on the view too, so
; Music.lua decides that.
[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State
IfCondition=(MeasureStatus = 0) || (MeasureState = 0)
IfTrueAction=[!SetVariable CtrlColor "#ColorTextMuted#"][!SetVariable PlayFill "#ColorAccentDim#"][!SetOptionGroup MusicTitleText Text "Nothing playing"][!SetOption MeterSub Text "Play something in Spotify"][!SetOption MeterArtistL Text "Play something in Spotify"][!SetOption MeterAlbumL Text ""][!DisableMouseActionGroup "LeftMouseUpAction" MusicCtrl]
IfFalseAction=[!SetVariable CtrlColor "#ColorTextPrimary#"][!SetVariable PlayFill "#ColorAccent#"][!SetOptionGroup MusicTitleText Text "%1"][!SetOption MeterSub Text "%1%2"][!SetOption MeterArtistL Text "%1"][!SetOption MeterAlbumL Text "%1"][!EnableMouseActionGroup "LeftMouseUpAction" MusicCtrl]

; 0 = off, 1 = repeat one, 2 = repeat all.
[MeasureRepeat]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Repeat
IfCondition=(MeasureStatus = 0) || (MeasureState = 0)
IfTrueAction=[!SetVariable RepeatColor "#ColorTextMuted#"]
IfCondition2=(MeasureStatus = 1) && (MeasureState > 0) && (MeasureRepeat = 0)
IfTrueAction2=[!SetVariable RepeatColor "#ColorTextSecondary#"]
IfCondition3=(MeasureStatus = 1) && (MeasureState > 0) && (MeasureRepeat > 0)
IfTrueAction3=[!SetVariable RepeatColor "#ColorAccent#"]

[MeasureShuffle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Shuffle
IfCondition=(MeasureStatus = 0) || (MeasureState = 0)
IfTrueAction=[!SetVariable ShuffleColor "#ColorTextMuted#"]
IfCondition2=(MeasureStatus = 1) && (MeasureState > 0) && (MeasureShuffle = 0)
IfTrueAction2=[!SetVariable ShuffleColor "#ColorTextSecondary#"]
IfCondition3=(MeasureStatus = 1) && (MeasureState > 0) && (MeasureShuffle = 1)
IfTrueAction3=[!SetVariable ShuffleColor "#ColorAccent#"]

; After the WebNowPlaying measures: reads their values each update.
[MeasureScript]
Measure=Script
ScriptFile=#@#Scripts\Music.lua

; ---- Styles -------------------------------------------------

[StyleMini]
Container=MeterMiniView

[StyleFull]
Container=MeterFullView

; Chevron button in an Ic box (Path ChevPath).
[StyleChevron]
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ChevPath | Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | Stroke Color #ColorTextSecondary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
LeftMouseUpAction=[!CommandMeasure MeasureScript "Toggle()"]

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard
@IncludeCardArt=#@#CardArt.inc

; ============ Collapsed view (group MiniView) ============

; Mask of the collapsed view (a container is not drawn itself).
[MeterMiniView]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardHMini# | Fill Color 255,255,255,255 | StrokeWidth 0

; Cover placeholder: rounded square with a note.
[MeterArtPh]
Meter=Shape
MeterStyle=StyleMini
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,#ArtS#,#ArtS#,#ArtRadius# | Fill Color #ColorBgAlt# | StrokeWidth 0
Shape2=Ellipse (#ArtS#*0.42),(#ArtS#*0.66),(#ArtS#*0.085) | Fill Color #ColorTextMuted# | StrokeWidth 0
Shape3=Path NoteStem | Fill Color 0,0,0,0 | StrokeWidth (#ArtS#*0.035) | Stroke Color #ColorTextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
NoteStem=(#ArtS#*0.505),(#ArtS#*0.66) | LineTo (#ArtS#*0.505),(#ArtS#*0.3) | LineTo (#ArtS#*0.64),(#ArtS#*0.37)
LeftMouseUpAction=["spotify:"]
Group=MiniView

; Cover clipped to a rounded square. A meter can only be in one
; container, so the masks are outside the view containers and
; Music.lua shows / hides them with the view.
[MeterArtMask]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,#ArtS#,#ArtS#,#ArtRadius# | Fill Color 255,255,255,255 | StrokeWidth 0

; ImageName (not MeasureName): an empty cover path must mean
; "no image", not the measure's number value. Shown by Music.lua.
[MeterArt]
Meter=Image
ImageName=[MeasureCoverPath]
DynamicVariables=1
Container=MeterArtMask
X=0
Y=0
W=#ArtS#
H=#ArtS#
PreserveAspectRatio=2
; Smooth edges when the cover is scaled down.
AntiAlias=1
LeftMouseUpAction=["spotify:"]
Hidden=1

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleBody | StyleMini
MeasureName=MeasureTitle
Text=%1
FontWeight=#FontWeightTitle#
X=#TextX#
Y=#TitleY#
W=(#TextW#-#Ic#-#Gap#)
ClipString=1
Group=MiniView | MusicTitleText

[MeterSub]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleMini
MeasureName=MeasureArtist
MeasureName2=MeasureAlbumSuffix
Text=%1%2
X=#TextX#
Y=#SubY#
W=#TextW#
ClipString=1
Group=MiniView

; Expand: chevron pointing down.
[MeterExpand]
Meter=Shape
MeterStyle=StyleChevron | StyleMini
X=(#CardW#-#Pad#-#Ic#)
Y=#ChevY#
ChevPath=(#Ic#*0.2),(#Ic#*0.36) | LineTo (#Ic#*0.5),(#Ic#*0.66) | LineTo (#Ic#*0.8),(#Ic#*0.36)
ToolTipText=Expand
Group=MiniView

[MeterPrev]
Meter=Shape
MeterStyle=StyleMini
X=#TextX#
Y=(#CtrlCY#-#Ic#/2)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle (#Ic#*0.1),(#Ic#*0.15),(#Ic#*0.13),(#Ic#*0.7),(#Ic#*0.06) | Fill Color #CtrlColor# | StrokeWidth 0
Shape3=Path PrevTri | Fill Color #CtrlColor# | StrokeWidth (#Ic#*0.08) | Stroke Color #CtrlColor# | StrokeLineJoin Round
PrevTri=(#Ic#*0.88),(#Ic#*0.18) | LineTo (#Ic#*0.32),(#Ic#*0.5) | LineTo (#Ic#*0.88),(#Ic#*0.82) | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasureState "Previous"]
DynamicVariables=1
Group=MiniView | MusicCtrl

[MeterPlayBtn]
Meter=Shape
MeterStyle=StyleMini
X=(#TextX#+#Ic#+#CtrlGap#)
Y=#CtrlTop#
Shape=Ellipse (#PlayButtonSize#/2),(#PlayButtonSize#/2),(#PlayButtonSize#/2) | Fill Color #PlayFill# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureState "PlayPause"][!UpdateMeasure MeasureState][!UpdateMeasure MeasureScript][!UpdateMeter *][!Redraw]
DynamicVariables=1
Group=MiniView | MusicCtrl

; Icons on the button have no mouse actions, so clicks fall
; through to the button. Music.lua shows one of the two.
[MeterPlayIcon]
Meter=Shape
MeterStyle=StyleMini
X=([MeterPlayBtn:X]+#PlayButtonSize#*0.36)
Y=([MeterPlayBtn:Y]+#PlayButtonSize#*0.3)
Shape=Path PlayTri | Fill Color #ColorOnAccent# | StrokeWidth (1.2*#Scale#) | Stroke Color #ColorOnAccent# | StrokeLineJoin Round
PlayTri=1,1 | LineTo (1+#PlayButtonSize#*0.34),(1+#PlayButtonSize#*0.2) | LineTo 1,(1+#PlayButtonSize#*0.4) | ClosePath 1
DynamicVariables=1
Hidden=1

[MeterPauseIcon]
Meter=Shape
MeterStyle=StyleMini
X=([MeterPlayBtn:X]+#PlayButtonSize#*0.33)
Y=([MeterPlayBtn:Y]+#PlayButtonSize#*0.3)
Shape=Rectangle 0,0,(#PlayButtonSize#*0.12),(#PlayButtonSize#*0.4),(1*#Scale#) | Fill Color #ColorOnAccent# | StrokeWidth 0
Shape2=Rectangle (#PlayButtonSize#*0.22),0,(#PlayButtonSize#*0.12),(#PlayButtonSize#*0.4),(1*#Scale#) | Fill Color #ColorOnAccent# | StrokeWidth 0
DynamicVariables=1
Hidden=1

[MeterNext]
Meter=Shape
MeterStyle=StyleMini
X=(#TextX#+#Ic#+2*#CtrlGap#+#PlayButtonSize#)
Y=(#CtrlCY#-#Ic#/2)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle (#Ic#*0.77),(#Ic#*0.15),(#Ic#*0.13),(#Ic#*0.7),(#Ic#*0.06) | Fill Color #CtrlColor# | StrokeWidth 0
Shape3=Path NextTri | Fill Color #CtrlColor# | StrokeWidth (#Ic#*0.08) | Stroke Color #CtrlColor# | StrokeLineJoin Round
NextTri=(#Ic#*0.12),(#Ic#*0.18) | LineTo (#Ic#*0.68),(#Ic#*0.5) | LineTo (#Ic#*0.12),(#Ic#*0.82) | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasureState "Next"]
DynamicVariables=1
Group=MiniView | MusicCtrl

; Click to seek. The first shape is a near-transparent hit area
; so the thin bar is easy to click. Shown by Music.lua (not idle).
[MeterSeek]
Meter=Shape
MeterStyle=StyleMini
X=#SeekX#
Y=(#CtrlCY#-#SeekHitH#/2)
Shape=Rectangle 0,0,#SeekW#,#SeekHitH# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle 0,((#SeekHitH#-#BarH#)/2),#SeekW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape3=Rectangle 0,((#SeekHitH#-#BarH#)/2),(Max(#BarH#,#SeekW#*Clamp([MeasureProgress:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #ColorAccent# | StrokeWidth 0
Shape4=Ellipse (Clamp(#SeekW#*[MeasureProgress:]/100,#KnobR#,#SeekW#-#KnobR#)),(#SeekHitH#/2),#KnobR# | Fill Color #ColorTextPrimary# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureState "SetPosition $MouseX:%$"][!UpdateMeasureGroup MusicPos][!UpdateMeter MeterSeek][!Redraw]
DynamicVariables=1
Hidden=1
Group=MusicCtrl

; ============ Expanded view (group FullView) ============

; Mask of the expanded view. Its meters reach below the collapsed
; card; as container contents they do not stretch the window
; while hidden.
[MeterFullView]
Meter=Shape
Shape=Rectangle 0,0,#CardW#,#CardHFull# | Fill Color 255,255,255,255 | StrokeWidth 0
Hidden=1

[MeterHead]
Meter=String
MeterStyle=StyleText | StyleTitle | StyleFull
Text=Now playing
Hidden=1
Group=FullView

; Collapse: chevron pointing up.
[MeterCollapse]
Meter=Shape
MeterStyle=StyleChevron | StyleFull
X=(#CardW#-#Pad#-#Ic#)
Y=#FChevY#
ChevPath=(#Ic#*0.2),(#Ic#*0.64) | LineTo (#Ic#*0.5),(#Ic#*0.34) | LineTo (#Ic#*0.8),(#Ic#*0.64)
ToolTipText=Collapse
Hidden=1
Group=FullView

[MeterArtPhL]
Meter=Shape
MeterStyle=StyleFull
X=#Pad#
Y=#FArtY#
Shape=Rectangle 0,0,#ArtSizeL#,#ArtSizeL#,#ArtRadius# | Fill Color #ColorBgAlt# | StrokeWidth 0
Shape2=Ellipse (#ArtSizeL#*0.42),(#ArtSizeL#*0.66),(#ArtSizeL#*0.085) | Fill Color #ColorTextMuted# | StrokeWidth 0
Shape3=Path NoteStem | Fill Color 0,0,0,0 | StrokeWidth (#ArtSizeL#*0.035) | Stroke Color #ColorTextMuted# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
NoteStem=(#ArtSizeL#*0.505),(#ArtSizeL#*0.66) | LineTo (#ArtSizeL#*0.505),(#ArtSizeL#*0.3) | LineTo (#ArtSizeL#*0.64),(#ArtSizeL#*0.37)
LeftMouseUpAction=["spotify:"]
Hidden=1
Group=FullView

[MeterArtMaskL]
Meter=Shape
X=#Pad#
Y=#FArtY#
Shape=Rectangle 0,0,#ArtSizeL#,#ArtSizeL#,#ArtRadius# | Fill Color 255,255,255,255 | StrokeWidth 0
Hidden=1

[MeterArtL]
Meter=Image
ImageName=[MeasureCoverPath]
DynamicVariables=1
Container=MeterArtMaskL
X=0
Y=0
W=#ArtSizeL#
H=#ArtSizeL#
PreserveAspectRatio=2
AntiAlias=1
LeftMouseUpAction=["spotify:"]
Hidden=1

[MeterTitleL]
Meter=String
MeterStyle=StyleText | StyleFull
MeasureName=MeasureTitle
Text=%1
FontSize=#FontSizeL#
FontWeight=#FontWeightTitle#
X=#FTextX#
Y=#FTitleY#
W=#FTextW#
ClipString=1
Hidden=1
Group=FullView | MusicTitleText

[MeterArtistL]
Meter=String
MeterStyle=StyleText | StyleBody | StyleFull
MeasureName=MeasureArtist
Text=%1
X=#FTextX#
Y=#FArtistY#
W=#FTextW#
ClipString=1
Hidden=1
Group=FullView

[MeterAlbumL]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleFull
MeasureName=MeasureAlbum
Text=%1
X=#FTextX#
Y=#FAlbumY#
W=#FTextW#
ClipString=1
Hidden=1
Group=FullView

; "1:24 / 3:51". Shown by Music.lua (not idle).
[MeterTimesL]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleFull
FontSize=#FontSizeM#
Text=[&MeasureScript:Times()]
X=#FTextX#
Y=#FTimesY#
DynamicVariables=1
Hidden=1

[MeterSeekL]
Meter=Shape
MeterStyle=StyleFull
X=#Pad#
Y=#FSeekY#
Shape=Rectangle 0,0,#FSeekW#,#SeekHitH# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle 0,((#SeekHitH#-#BarH#)/2),#FSeekW#,#BarH#,(#BarH#/2) | Fill Color #ColorAccentDim# | StrokeWidth 0
Shape3=Rectangle 0,((#SeekHitH#-#BarH#)/2),(Max(#BarH#,#FSeekW#*Clamp([MeasureProgress:],0,100)/100)),#BarH#,(#BarH#/2) | Fill Color #ColorAccent# | StrokeWidth 0
Shape4=Ellipse (Clamp(#FSeekW#*[MeasureProgress:]/100,#KnobR#,#FSeekW#-#KnobR#)),(#SeekHitH#/2),#KnobR# | Fill Color #ColorTextPrimary# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureState "SetPosition $MouseX:%$"][!UpdateMeasureGroup MusicPos][!UpdateMeter MeterSeekL][!Redraw]
DynamicVariables=1
Hidden=1
Group=MusicCtrl

[MeterShuffle]
Meter=Shape
MeterStyle=StyleFull
X=#Pad#
Y=(#FCtrlCY#-#Ic#/2)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path ShufA | Extend ShufStroke
Shape3=Path ShufB | Extend ShufStroke
Shape4=Path ShufHeadTop | Extend ShufStroke
Shape5=Path ShufHeadBot | Extend ShufStroke
ShufA=(#Ic#*0.06),(#Ic#*0.25) | LineTo (#Ic#*0.3),(#Ic#*0.25) | LineTo (#Ic#*0.62),(#Ic#*0.75) | LineTo (#Ic#*0.92),(#Ic#*0.75)
ShufB=(#Ic#*0.06),(#Ic#*0.75) | LineTo (#Ic#*0.3),(#Ic#*0.75) | LineTo (#Ic#*0.62),(#Ic#*0.25) | LineTo (#Ic#*0.92),(#Ic#*0.25)
ShufHeadTop=(#Ic#*0.76),(#Ic#*0.1) | LineTo (#Ic#*0.92),(#Ic#*0.25) | LineTo (#Ic#*0.76),(#Ic#*0.4)
ShufHeadBot=(#Ic#*0.76),(#Ic#*0.6) | LineTo (#Ic#*0.92),(#Ic#*0.75) | LineTo (#Ic#*0.76),(#Ic#*0.9)
ShufStroke=Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | Stroke Color #ShuffleColor# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round
LeftMouseUpAction=[!CommandMeasure MeasureState "Shuffle"][!UpdateMeasure MeasureShuffle][!UpdateMeter MeterShuffle][!Redraw]
ToolTipText=Shuffle
DynamicVariables=1
Hidden=1
Group=FullView | MusicCtrl

[MeterPrevL]
Meter=Shape
MeterStyle=StyleFull
X=(#FPlayX#-#CtrlGapL#-#IcL#)
Y=(#FCtrlCY#-#IcL#/2)
Shape=Rectangle 0,0,#IcL#,#IcL# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle (#IcL#*0.1),(#IcL#*0.15),(#IcL#*0.13),(#IcL#*0.7),(#IcL#*0.06) | Fill Color #CtrlColor# | StrokeWidth 0
Shape3=Path PrevTri | Fill Color #CtrlColor# | StrokeWidth (#IcL#*0.08) | Stroke Color #CtrlColor# | StrokeLineJoin Round
PrevTri=(#IcL#*0.88),(#IcL#*0.18) | LineTo (#IcL#*0.32),(#IcL#*0.5) | LineTo (#IcL#*0.88),(#IcL#*0.82) | ClosePath 1
LeftMouseUpAction=[!CommandMeasure MeasureState "Previous"]
DynamicVariables=1
Hidden=1
Group=FullView | MusicCtrl

[MeterPlayBtnL]
Meter=Shape
MeterStyle=StyleFull
X=#FPlayX#
Y=#FCtrlTop#
Shape=Ellipse (#PlayButtonSizeL#/2),(#PlayButtonSizeL#/2),(#PlayButtonSizeL#/2) | Fill Color #PlayFill# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureState "PlayPause"][!UpdateMeasure MeasureState][!UpdateMeasure MeasureScript][!UpdateMeter *][!Redraw]
DynamicVariables=1
Hidden=1
Group=FullView | MusicCtrl

[MeterPlayIconL]
Meter=Shape
MeterStyle=StyleFull
X=([MeterPlayBtnL:X]+#PlayButtonSizeL#*0.36)
Y=([MeterPlayBtnL:Y]+#PlayButtonSizeL#*0.3)
Shape=Path PlayTri | Fill Color #ColorOnAccent# | StrokeWidth (1.4*#Scale#) | Stroke Color #ColorOnAccent# | StrokeLineJoin Round
