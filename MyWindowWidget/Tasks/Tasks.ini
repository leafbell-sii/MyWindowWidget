; =============================================================
;  MyWindowWidget - Google Tasks
;
;  One card as tall as the Calendar (CalendarHeight). It is split
;  into equal sections, one per task list: 1, 2 or 3 lists are all
;  shown at once; with 4 or more, < > in the header pages through
;  them. Tasks are sorted by due date (no due date last).
;
;  Data comes from @Resources\Scripts\Tasks.lua, which runs
;  GTasks.ps1 (OAuth 2.0 + Google Tasks API) in a hidden window
;  through the bundled RunCommand plugin. Adding uses the bundled
;  InputText plugin. Sign-in is a one-time console step, see
;  README "Google Tasks".
;
;  Header: "Updated 5m ago" and a sync button (the TASKS title syncs
;  too). Mouse: < > = other lists, circle = mark
;  as done, "+" next to a list name = type a new task (Enter adds,
;  Esc or click elsewhere cancels).
;
;  The section and row meters below were generated by a script;
;  they only differ in their numbers. Tasks.lua places them (X, Y)
;  and shows as many as fit.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Tasks
Author=leafbell-sii
Information=Google Tasks lists with add and complete, sorted by due date. One-time sign-in: see README (Google Tasks).
Version=0.2.0
License=MIT

[Variables]
CardW=#TasksWidth#
CardH=#CalendarHeight#
Ic=#IconSize#
HeadH=(20*#Scale#)
RowH=(24*#Scale#)
SecHeadH=(24*#Scale#)
TaskIndent=(18*#Scale#)
DueW=(70*#Scale#*#FontScale#)
; Page label between < and > ("2/3").
PageW=(30*#Scale#*#FontScale#)
; Top of the first section; the sections fill down to CardH-Pad.
BodyY=(#Pad#+#HeadH#+#Gap#/2)

; ---- Measures -----------------------------------------------

; Parameter is set by Tasks.lua before every Run. Hide kills the
; script if the skin is refreshed or unloaded mid-run. Timeout
; (ms) stops a hung run; FinishAction still fires.
[MeasureRun]
Measure=Plugin
Plugin=RunCommand
State=Hide
Timeout=60000
FinishAction=[!CommandMeasure MeasureTasks "OnDone()"]

[MeasureTasks]
Measure=Script
ScriptFile=#@#Scripts\Tasks.lua

; Edit box over the header row of a section; Tasks.lua sets Y
; before opening it. InputText can only use fonts installed in
; Windows (not @Resources\Fonts): InputFontFace.
; Triple quotes keep a " typed by the user inside the bang; the
; Lua long string [==[ ]==] keeps quotes and backslashes as-is.
[MeasureTaskInput]
Measure=Plugin
Plugin=InputText
X=#Pad#
Y=#BodyY#
W=(#CardW#-2*#Pad#)
H=(#SecHeadH#-4*#Scale#)
SolidColor=#ColorBgRGB#,255
FontColor=#ColorTextPrimary#
FontFace=#InputFontFace#
FontSize=#FontSizeM#
InputLimit=1024
FocusDismiss=1
Command1=[!CommandMeasure MeasureTasks """Add([==[$UserInput$]==])"""]

; ---- Styles -------------------------------------------------

[StyleChevron]
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
ChevronStroke=Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | Stroke Color #ColorTextSecondary# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round

; List name at the top of a section. Lua sets Y and Text.
[StyleSecName]
StringAlign=LeftCenter
X=#Pad#
W=(#CardW#-2*#Pad#-#Ic#-#Gap#-#DueW#)
ClipString=1
FontWeight=#FontWeightTitle#
Hidden=1
Group=Tasks

; "+3 more" left of the add button. Lua sets Y and Text.
[StyleSecMore]
StringAlign=RightCenter
X=(#CardW#-#Pad#-#Ic#-#Gap#)
Hidden=1
Group=Tasks

; Add button: a plus in an Ic box. Lua sets Y.
[StyleSecAdd]
X=(#CardW#-#Pad#-#Ic#)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path PlusV | Extend PlusStroke
Shape3=Path PlusH | Extend PlusStroke
PlusV=(#Ic#*0.5),(#Ic#*0.18) | LineTo (#Ic#*0.5),(#Ic#*0.82)
PlusH=(#Ic#*0.18),(#Ic#*0.5) | LineTo (#Ic#*0.82),(#Ic#*0.5)
PlusStroke=Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | Stroke Color #ColorAccent# | StrokeStartCap Round | StrokeEndCap Round
ToolTipText=Add task
Hidden=1
Group=Tasks

; Line between sections. Lua sets Y.
[StyleSecSep]
Hidden=1
Group=Tasks

; Round check box; the tick shows on hover. Lua sets X, Y.
[StyleTaskCheck]
X=#Pad#
Shape=Ellipse (#Ic#/2),(#Ic#/2),(#Ic#/2-#IconStrokeW#) | Fill Color 0,0,0,1 | StrokeWidth #IconStrokeW# | Stroke Color #ColorTextSecondary#
Shape2=Path CheckPath | Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round | Extend CheckColor
CheckPath=(#Ic#*0.3),(#Ic#*0.52) | LineTo (#Ic#*0.45),(#Ic#*0.67) | LineTo (#Ic#*0.72),(#Ic#*0.36)
CheckColor=Stroke Color 0,0,0,0
MouseOverAction=[!SetOption #CURRENTSECTION# CheckColor "Stroke Color #ColorAccent#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# CheckColor "Stroke Color 0,0,0,0"][!UpdateMeter #CURRENTSECTION#][!Redraw]
ToolTipText=Mark as done
Hidden=1
Group=Tasks

; Lua sets X, Y, W, Text, ToolTipText, FontColor.
[StyleTaskText]
StringAlign=LeftCenter
X=#Pad#
ClipString=1
Hidden=1
Group=Tasks

; Lua sets Y, Text, FontColor.
[StyleTaskDue]
StringAlign=RightCenter
X=(#CardW#-#Pad#)
Hidden=1
Group=Tasks

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard
@IncludeCardArt=#@#CardArt.inc

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Y=(#Pad#+#HeadH#/2)
StringAlign=LeftCenter
SolidColor=0,0,0,1
Text=Tasks
ToolTipText=Sync now
LeftMouseUpAction=[!CommandMeasure MeasureTasks "Refresh()"]

; "Updated 5m ago" / Syncing / Offline / error. Lua sets X (left
; of the sync button), Text and ToolTipText (last sync time).
[MeterStatus]
Meter=String
MeterStyle=StyleText | StyleLabel
StringAlign=RightCenter
X=(#CardW#-#Pad#)
Y=(#Pad#+#HeadH#/2)
Text=
Group=Tasks

; Sync now: a circular arrow (300 degree arc, clockwise, arrow head
; at the top). Lua sets X (left of the paging) and IconColor
; (dimmed while a sync runs).
[MeterSync]
Meter=Shape
X=(#CardW#-#Pad#-#Ic#)
Y=(#Pad#+#HeadH#/2-#Ic#/2)
Shape=Rectangle 0,0,#Ic#,#Ic# | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Path SyncArc | Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | StrokeStartCap Round | StrokeEndCap Round | Extend IconColor
Shape3=Path SyncHead | Fill Color 0,0,0,0 | StrokeWidth #IconStrokeW# | StrokeStartCap Round | StrokeEndCap Round | StrokeLineJoin Round | Extend IconColor
SyncArc=(#Ic#*0.777),(#Ic#*0.38) | ArcTo (#Ic#*0.5),(#Ic#*0.22),(#Ic#*0.32),(#Ic#*0.32),0,0,1
SyncHead=(#Ic#*0.48),(#Ic#*0.08) | LineTo (#Ic#*0.63),(#Ic#*0.22) | LineTo (#Ic#*0.48),(#Ic#*0.36)
IconColor=Stroke Color #ColorTextSecondary#
ToolTipText=Sync now
LeftMouseUpAction=[!CommandMeasure MeasureTasks "Refresh()"]
Hidden=1
Group=Tasks

[MeterPrev]
Meter=Shape
MeterStyle=StyleChevron
X=(#CardW#-#Pad#-2*#Ic#-#PageW#)
Y=(#Pad#+#HeadH#/2-#Ic#/2)
Shape2=Path ChevronLeft | Extend ChevronStroke
ChevronLeft=(#Ic#*0.65),(#Ic#*0.15) | LineTo (#Ic#*0.3),(#Ic#*0.5) | LineTo (#Ic#*0.65),(#Ic#*0.85)
ToolTipText=Previous lists
LeftMouseUpAction=[!CommandMeasure MeasureTasks "PrevPage()"]
Hidden=1
Group=Tasks

[MeterPage]
Meter=String
MeterStyle=StyleText | StyleLabel
StringAlign=CenterCenter
X=(#CardW#-#Pad#-#Ic#-#PageW#/2)
Y=(#Pad#+#HeadH#/2)
Text=
Hidden=1
Group=Tasks

[MeterNext]
Meter=Shape
MeterStyle=StyleChevron
X=(#CardW#-#Pad#-#Ic#)
Y=(#Pad#+#HeadH#/2-#Ic#/2)
Shape2=Path ChevronRight | Extend ChevronStroke
ChevronRight=(#Ic#*0.35),(#Ic#*0.15) | LineTo (#Ic#*0.7),(#Ic#*0.5) | LineTo (#Ic#*0.35),(#Ic#*0.85)
ToolTipText=Next lists
LeftMouseUpAction=[!CommandMeasure MeasureTasks "NextPage()"]
Hidden=1
Group=Tasks

; Loading / not connected / no lists.
[MeterEmpty]
Meter=String
MeterStyle=StyleText | StyleBody
FontColor=#ColorTextSecondary#
StringAlign=CenterCenter
X=(#CardW#/2)
Y=((#BodyY#+#CardH#-#Pad#)/2)
W=(#CardW#-2*#Pad#)
H=(#CardH#-#Pad#-#BodyY#)
ClipString=2
Text=
Group=Tasks

