; =============================================================
;  MyWindowWidget - Google Tasks, slot 1
;  Tasks\List1..4 are identical except TasksSlot: one config per
;  card, so up to four lists can be on screen at once. The card
;  itself is @Resources\TasksSkin.inc.
; =============================================================
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Group=MyWindowWidget
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=MyWindowWidget Tasks 1
Author=leafbell-sii
Information=Google Tasks list with add and complete. Slot 1 shows your list 1 by default. One-time sign-in: see README (Google Tasks).
Version=0.1.0
License=MIT

[Variables]
TasksSlot=1
@IncludeTasks=#@#TasksSkin.inc