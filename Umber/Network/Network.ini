; =============================================================
;  Umber - Network
;  Download / upload rate with auto units, overlapped line
;  graph (download = Accent, upload = AccentDim) and today's
;  total. Follows the active adapter (Interface=Best).
;  Settings (Variables.inc): UseBits
; =============================================================
[Rainmeter]
Update=#NetUpdate#
AccurateText=1
DynamicWindowSize=1
Group=Umber
MouseOverAction=#HoverIn#
MouseLeaveAction=#HoverOut#
@IncludeVariables=#@#Variables.inc
@IncludeStyles=#@#Styles.inc

[Metadata]
Name=Umber Network
Author=Umber
Information=Network download / upload speed and today's traffic.
Version=0.1.0
License=See README

[Variables]
CardW=#WidgetWidth#
CardH=([MeterTodayLabel:YH]+#Pad#)
; Skin update interval (ms). Network.lua uses it to turn the
; per-second rate into bytes for today's total.
NetUpdate=1000

; Two columns: download (left), upload (right).
ColLeftR=(#CardW#/2-#Gap#/2)
ColRightL=(#CardW#/2+#Gap#/2)
ColRightR=(#CardW#-#Pad#)
; Fixed unit column so numbers do not shift when units change.
UnitW=(30*#Scale#)
UnitGap=(3*#Scale#)

GraphW=(#CardW#-2*#Pad#)
GraphH=(44*#Scale#)

; ---- Measures -----------------------------------------------

; DynamicVariables=1 lets Interface=Best re-detect the active
; adapter (Wi-Fi <-> wired) without a refresh.
[MeasureNetIn]
Measure=NetIn
Interface=Best
UseBits=#UseBits#
DynamicVariables=1

[MeasureNetOut]
Measure=NetOut
Interface=Best
UseBits=#UseBits#
DynamicVariables=1

[MeasureNetScript]
Measure=Script
ScriptFile=#@#Scripts\Network.lua

; ---- Meters -------------------------------------------------

[MeterBg]
Meter=Shape
MeterStyle=StyleCard

[MeterTitle]
Meter=String
MeterStyle=StyleText | StyleTitle
Text=Network

; ---- Download column ----

[MeterInNum]
Meter=String
MeterStyle=StyleText | StyleValue
Text=[&MeasureNetScript:InNum()]
StringAlign=Right
X=(#ColLeftR#-#UnitW#-#UnitGap#)
Y=(#Gap#)R
DynamicVariables=1

[MeterInUnit]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=[&MeasureNetScript:InUnit()]
X=(#ColLeftR#-#UnitW#)
Y=(1.44*(#FontSizeL#-#FontSizeS#))r
DynamicVariables=1

; ---- Upload column ----

[MeterOutNum]
Meter=String
MeterStyle=StyleText | StyleValue
Text=[&MeasureNetScript:OutNum()]
StringAlign=Right
X=(#ColRightR#-#UnitW#-#UnitGap#)
Y=([MeterInNum:Y])
DynamicVariables=1

[MeterOutUnit]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=[&MeasureNetScript:OutUnit()]
X=(#ColRightR#-#UnitW#)
Y=(1.44*(#FontSizeL#-#FontSizeS#))r
DynamicVariables=1

; ---- Direction arrows (Shape, colour = graph legend) ----

[MeterInArrow]
Meter=Shape
MeterStyle=StyleArrowDown
X=#Pad#
Y=([MeterInNum:Y]+[MeterInNum:H]/2-#ArrowS#/2)
DynamicVariables=1

[MeterOutArrow]
Meter=Shape
MeterStyle=StyleArrowUp
X=#ColRightL#
Y=([MeterInNum:Y]+[MeterInNum:H]/2-#ArrowS#/2)
DynamicVariables=1

; ---- Graph ----

[MeterGraph]
Meter=Line
MeterStyle=StyleLineGraph
LineCount=2
MeasureName=MeasureNetIn
MeasureName2=MeasureNetOut
LineColor=#ColorAccent#
LineColor2=#ColorAccentDim#
AutoScale=1
X=#Pad#
Y=([MeterInNum:YH]+#Gap#)
W=#GraphW#
H=#GraphH#
DynamicVariables=1

[MeterGraphBaseline]
Meter=Shape
X=#Pad#
Y=(#GraphH#-1)r
Shape=Rectangle 0,0,#GraphW#,1 | Fill Color #ColorBorder# | StrokeWidth 0

; ---- Today ----

[MeterTodayLabel]
Meter=String
MeterStyle=StyleText | StyleLabel
Text=Today
X=#Pad#
Y=(#Gap#)R

[MeterTodayValue]
Meter=String
MeterStyle=StyleText | StyleLabel | StyleRight
Text=[\x2193] [&MeasureNetScript:TodayIn()]    [\x2191] [&MeasureNetScript:TodayOut()]
FontColor=#ColorTextPrimary#
Y=r
DynamicVariables=1
